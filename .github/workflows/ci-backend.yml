name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

# Strict Principle of Least Privilege
permissions:
  contents: read
  security-events: write

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Dev Dependencies
        run: pip install ruff mypy bandit pip-audit
      - name: Ruff Lint
        run: ruff check backend/
      - name: Mypy Type Check
        run: |
          mypy backend/services/user_service/src
          mypy backend/services/farm_service/src
          mypy backend/services/advisory_service/src
      - name: Bandit Security Scan
        run: bandit -r backend/ -ll
      - name: Dependency Vulnerability Audit
        run: pip-audit

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    permissions:
      contents: read

    services:
      postgres:
        image: timescale/timescaledb-ha:pg16-latest
        env:
          POSTGRES_DB: agridecision_test
          POSTGRES_USER: qa_tester
          POSTGRES_PASSWORD: secret_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa_tester"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      wiremock:
        image: wiremock/wiremock:3
        ports:
          - 8089:8080
        volumes:
          - ${{ github.workspace }}/testing/mocks:/home/wiremock

    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Test Dependencies
        run: |
          pip install pytest pytest-asyncio pytest-cov httpx psycopg2-binary redis requests mock
      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql://qa_tester:secret_test_password@localhost:5432/agridecision_test
        run: |
          cd backend/services/user_service && alembic upgrade head
          cd ../farm_service && alembic upgrade head
          cd ../advisory_service && alembic upgrade head
      - name: Run Integration Tests
        env:
          APP_ENV: testing
          DATABASE_URL: postgresql://qa_tester:secret_test_password@localhost:5432/agridecision_test
          REDIS_URL: redis://localhost:6379/0
          SMS_GATEWAY_URL: http://localhost:8089/v1/sms/send
        run: pytest testing/integration/ -v --tb=short --cov=backend --cov-report=xml --override-ini="addopts="
      - name: Upload Coverage
        uses: codecov/codecov-action@v4.6.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: integration-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Harbor Registry
        uses: docker/login-action@v3
        with:
          registry: harbor.agridecision.ai
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - name: Build & Push user-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: devops/docker/backend.Dockerfile
          build-args: SERVICE=user-service
          push: true
          tags: harbor.agridecision.ai/core/user-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Sign Image with Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.2.0"
      - run: |
          cosign sign --yes harbor.agridecision.ai/core/user-service:${{ github.sha }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
