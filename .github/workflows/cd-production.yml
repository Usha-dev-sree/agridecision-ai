name: Production Deployment

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Docker image tag to deploy"
        required: true
      canary_weight:
        description: "Initial canary traffic weight (5, 10, 50)"
        required: false
        default: "5"

env:
  ARGOCD_SERVER: argocd.platform.agridecision.ai
  ARGOCD_APP: agridecision-production

jobs:
  pre-deployment-gate:
    name: Pre-Deployment Security Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cosign Image Signatures
        uses: sigstore/cosign-installer@v3
      - name: Verify all service images are signed
        env:
          COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}
        run: |
          TAG=${{ github.ref_name }}
          cosign verify --key env://COSIGN_PUBLIC_KEY harbor.agridecision.ai/core/user-service:${TAG}
          cosign verify --key env://COSIGN_PUBLIC_KEY harbor.agridecision.ai/advisory/advisory-service:${TAG}
          echo "All image signatures verified."
      - name: Trivy Final Scan — Block on Critical CVEs
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: harbor.agridecision.ai/core/user-service:${{ github.ref_name }}
          exit-code: "1"
          severity: "CRITICAL"

  canary-deployment:
    name: Canary Release (5% → 50% → 100%)
    runs-on: ubuntu-latest
    needs: pre-deployment-gate
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd
      - name: Login to ArgoCD
        run: |
          argocd login ${{ env.ARGOCD_SERVER }} \
            --username ${{ secrets.ARGOCD_USERNAME }} \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --grpc-web

      - name: Update Image Tag in GitOps Repo
        run: |
          TAG=${{ github.ref_name }}
          argocd app set ${{ env.ARGOCD_APP }} \
            --helm-set-string image.tag=${TAG}

      - name: Set Canary Weight — 5%
        run: |
          argocd app set ${{ env.ARGOCD_APP }} \
            --helm-set-string rollout.canaryWeight=5
          argocd app sync ${{ env.ARGOCD_APP }} --prune
          echo "Canary deployed at 5% traffic. Monitoring for 10 minutes..."
          sleep 600

      - name: Check Error Rate after Canary 5%
        run: |
          ERROR_RATE=$(curl -s "https://prometheus.agridecision.ai/api/v1/query?query=rate(http_requests_total{status=~'5..'}[5m])/rate(http_requests_total[5m])*100" | jq '.data.result[0].value[1]' -r)
          echo "5xx error rate: ${ERROR_RATE}%"
          if (( $(echo "$ERROR_RATE > 1.0" | bc -l) )); then
            echo "CRITICAL: Error rate exceeded 1%. Triggering rollback."
            argocd app rollback ${{ env.ARGOCD_APP }}
            exit 1
          fi

      - name: Promote Canary — 50%
        run: |
          argocd app set ${{ env.ARGOCD_APP }} --helm-set-string rollout.canaryWeight=50
          argocd app sync ${{ env.ARGOCD_APP }} --prune
          echo "Promoted to 50% traffic. Monitoring for 10 minutes..."
          sleep 600

      - name: Promote Canary — 100% (Full Rollout)
        run: |
          argocd app set ${{ env.ARGOCD_APP }} --helm-set-string rollout.canaryWeight=100
          argocd app sync ${{ env.ARGOCD_APP }} --prune
          echo "Full production rollout complete."

      - name: Run Production Smoke Tests
        run: bash scripts/ops/smoke_test.sh

      - name: Notify Slack — Production Deployment Success
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {"text": "✅ AgriDecision AI Production Deployment *${{ github.ref_name }}* Complete — 100% traffic promoted."}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_PRODUCTION }}
