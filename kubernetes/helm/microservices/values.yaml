global:
  environment: production
  imageRegistry: "602401143452.dkr.ecr.us-east-1.amazonaws.com"
  imagePullPolicy: IfNotPresent

services:
  user-service:
    replicaCount: 3
    imageName: "user-service"
    imageTag: "latest"
    containerPort: 8000
    resources:
      limits:
        cpu: 1000m
        memory: 1024Mi
      requests:
        cpu: 250m
        memory: 256Mi
    env:
      DATABASE_URL: "postgresql://postgres:SecretPassword123@postgres:5432/agridecision_user"
      REDIS_URL: "redis://redis:6379/0"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      VAULT_ADDR: "http://vault:8200"

  farm-service:
    replicaCount: 3
    imageName: "farm-service"
    imageTag: "latest"
    containerPort: 8001
    resources:
      limits:
        cpu: 1000m
        memory: 1024Mi
      requests:
        cpu: 250m
        memory: 256Mi
    env:
      DATABASE_URL: "postgresql://postgres:SecretPassword123@timescaledb:5432/agridecision_farm"
      REDIS_URL: "redis://redis:6379/1"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"

  advisory-service:
    replicaCount: 2
    imageName: "advisory-service"
    imageTag: "latest"
    containerPort: 8002
    resources:
      limits:
        cpu: 500m
        memory: 512Mi
      requests:
        cpu: 100m
        memory: 128Mi
    env:
      DATABASE_URL: "postgresql://postgres:SecretPassword123@timescaledb:5432/agridecision_farm"
      REDIS_URL: "redis://redis:6379/2"

  ai-service:
    replicaCount: 2
    imageName: "ai-service"
    imageTag: "latest"
    containerPort: 8080
    resources:
      limits:
        cpu: 2000m
        memory: 4096Mi
      requests:
        cpu: 500m
        memory: 1024Mi
    env:
      TRITON_SERVER_URL: "triton-inference-server:8001"
      MODEL_VERSION: "1"
