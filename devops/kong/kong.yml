_format_version: "3.0"
_transform: true

services:
  - name: user-service
    url: http://host.docker.internal:8000
    routes:
      - name: user-auth-routes
        paths:
          - /v1/auth
          - /v1/users
          - /v1/docs
          - /v1/openapi.json
          - /v1/static
          - /docs
          - /openapi.json
        strip_path: false
  - name: farm-service
    url: http://host.docker.internal:8001
    routes:
      - name: farm-routes
        paths:
          - /v1/plots
          - /v1/farms
          - /v1/soil
        strip_path: false
  - name: advisory-service
    url: http://host.docker.internal:8002
    routes:
      - name: advisory-routes
        paths:
          - /v1/advisory
          - /v1/recommendations
          - /v1/irrigation
          - /v1/diagnosis
        strip_path: false
  - name: weather-service
    url: http://host.docker.internal:8003
    routes:
      - name: weather-routes
        paths:
          - /v1/weather
          - /v1/forecasts
        strip_path: false
  - name: market-service
    url: http://host.docker.internal:8004
    routes:
      - name: market-routes
        paths:
          - /v1/market
          - /v1/commodities
          - /v1/mandi
        strip_path: false
  - name: iot-service
    url: http://host.docker.internal:8009
    routes:
      - name: iot-routes
        paths:
          - /v1/iot
        strip_path: false
  - name: analytics-service
    url: http://host.docker.internal:8005
    routes:
      - name: analytics-routes
        paths:
          - /v1/analytics
          - /v1/reports
        strip_path: false
  - name: financial-service
    url: http://host.docker.internal:8006
    routes:
      - name: financial-routes
        paths:
          - /v1/financial
          - /v1/expenses
          - /v1/revenue
          - /v1/loans
        strip_path: false
  - name: notification-service
    url: http://host.docker.internal:8007
    routes:
      - name: notification-routes
        paths:
          - /v1/notifications
          - /v1/alerts
        strip_path: false
  - name: enterprise-service
    url: http://host.docker.internal:8008
    routes:
      - name: enterprise-routes
        paths:
          - /v1/enterprise
          - /v1/tenants
          - /v1/fpo
        strip_path: false

# ── Global Plugins ──────────────────────────────────────────
plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "http://localhost:5173"
        - "http://localhost:5174"
        - "https://app.agridecision.ai"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-Type
        - Authorization
        - X-Request-ID
      exposed_headers:
        - X-Request-ID
      credentials: true
      max_age: 3600
  - name: rate-limiting
    config:
      second: 20
      minute: 500
      hour: 10000
      policy: local
  - name: request-size-limiting
    config:
      allowed_payload_size: 10
      size_unit: megabytes
