
networks:
  agri-network:
    driver: bridge

volumes:
  postgres_data:
  timescale_data:
  redis_data:
  kafka_data:
  vault_data:
  prometheus_data:
  grafana_data:

# ─── Common environment anchor ────────────────────────────────────────────────
x-common-env: &common-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:SecretPassword123@postgres:5432/agridecision_user}
  TIMESCALE_URL: ${TIMESCALE_URL:-postgresql+asyncpg://postgres:SecretPassword123@timescaledb:5432/agridecision_farm}
  REDIS_URL: ${REDIS_URL:-redis://:SecretRedis123@redis:6379/0}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-SecretRedis123}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
  KAFKA_CONSUMER_GROUP_ID: ${KAFKA_CONSUMER_GROUP_ID:-agridecision-local}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-agridecision-local-dev-secret-key-change-in-production}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
  JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-30}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:5174}
  DB_POOL_SIZE: 10
  DB_MAX_OVERFLOW: 20

# Common healthcheck dep anchors
x-depends-infra: &depends-infra
  postgres:
    condition: service_healthy
  timescaledb:
    condition: service_healthy
  redis:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  # ─── Datastores ─────────────────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: agri-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agridecision_user}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecretPassword123}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb-ha:pg15
    container_name: agri-timescaledb
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-agridecision_farm}
      POSTGRES_USER: ${TIMESCALE_USER:-postgres}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-SecretPassword123}
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: agri-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-SecretRedis123}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - agri-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-SecretRedis123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: agri-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=ruok,mntr,srvr,stat"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:-UseContainerSupport"
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q 'imok' || (echo ruok > /dev/tcp/localhost/2181) 2>/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: agri-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_JVM_PERFORMANCE_OPTS: "-XX:-UseContainerSupport"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s

  # ─── Secrets & API Gateway ──────────────────────────────────────────────────
  vault:
    image: hashicorp/vault:1.15
    container_name: agri-vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "${VAULT_DEV_ROOT_TOKEN:-root-token}"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_UI: "true"
    volumes:
      - vault_data:/vault/file
    networks:
      - agri-network
    command: server -dev

  kong:
    image: kong:3.8
    container_name: agri-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:8443 ssl http2"
      KONG_ADMIN_LISTEN: "0.0.0.0:8001, 0.0.0.0:8444 ssl"
      KONG_STATUS_LISTEN: "0.0.0.0:8001"
    ports:
      - "8080:8000"
      - "8443:8443"
      - "8081:8001"
    volumes:
      - ./devops/kong/kong.yml:/usr/local/kong/kong.yml:ro
    networks:
      - agri-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ─── Database Migrations (one-shot) ─────────────────────────────────────────
  # This container runs alembic upgrade head and exits 0 when migrations are
  # already at head (no-op). It is intentionally restart: "no".
  db-migrate:
    image: agridecision-ai-db-migrate:latest
    container_name: agri-db-migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:SecretPassword123@postgres:5432/agridecision_user
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agri-network
    restart: "no"

  # ─── Backend Microservices ───────────────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: backend/services/user_service/Dockerfile
    container_name: agri-user-service
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:SecretPassword123@postgres:5432/agridecision_user
    depends_on:
      <<: *depends-infra
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  farm-service:
    build:
      context: .
      dockerfile: backend/services/farm_service/Dockerfile
    container_name: agri-farm-service
    ports:
      - "8001:8001"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:SecretPassword123@timescaledb:5432/agridecision_farm
    depends_on:
      <<: *depends-infra
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  advisory-service:
    build:
      context: .
      dockerfile: backend/services/advisory_service/Dockerfile
    container_name: agri-advisory-service
    ports:
      - "8002:8002"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:SecretPassword123@postgres:5432/agridecision_user
    depends_on:
      <<: *depends-infra
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  weather-service:
    build:
      context: .
      dockerfile: backend/services/weather_service/Dockerfile
    container_name: agri-weather-service
    ports:
      - "8003:8003"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:SecretPassword123@timescaledb:5432/agridecision_farm
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-your_openweather_key_here}
    depends_on:
      <<: *depends-infra
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  market-service:
    build:
      context: .
      dockerfile: backend/services/market_service/Dockerfile
    container_name: agri-market-service
    ports:
      - "8004:8004"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:SecretPassword123@postgres:5432/agridecision_user
    depends_on:
      <<: *depends-infra
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: backend/services/analytics_service/Dockerfile
    container_name: agri-analytics-service
    ports:
      - "8005:8005"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:SecretPassword123@timescaledb:5432/agridecision_farm
    depends_on:
      <<: *depends-infra
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8005/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  financial-service:
    build:
      context: .
      dockerfile: backend/services/financial_service/Dockerfile
    container_name: agri-financial-service
    ports:
      - "8006:8006"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:SecretPassword123@postgres:5432/agridecision_user
    depends_on:
      <<: *depends-infra
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8006/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: backend/services/notification_service/Dockerfile
    container_name: agri-notification-service
    ports:
      - "8007:8007"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:SecretPassword123@postgres:5432/agridecision_user
      SMS_GATEWAY_URL: ${SMS_GATEWAY_URL:-http://localhost:8089/v1/sms/send}
      SMS_GATEWAY_TOKEN: ${SMS_GATEWAY_TOKEN:-mock_token_for_local_dev}
    depends_on:
      <<: *depends-infra
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8007/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  enterprise-service:
    build:
      context: .
      dockerfile: backend/services/enterprise_service/Dockerfile
    container_name: agri-enterprise-service
    ports:
      - "8008:8008"
    environment:
      <<: *common-env
      DATABASE_URL: postgresql+asyncpg://postgres:SecretPassword123@postgres:5432/agridecision_user
    depends_on:
      <<: *depends-infra
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8008/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  iot-service:
    build:
      context: .
      dockerfile: backend/services/iot_service/Dockerfile
    container_name: agri-iot-service
    ports:
      - "8009:8009"
    environment:
      <<: *common-env
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8009/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # ─── Frontend ────────────────────────────────────────────────────────────────
  agronomist-portal:
    build:
      context: .
      dockerfile: frontend/apps/agronomist-portal/Dockerfile
    container_name: agri-agronomist-portal
    ports:
      - "3000:3000"
    networks:
      - agri-network
    depends_on:
      - user-service
      - farm-service
    restart: unless-stopped

  # ─── Observability (LGTM Stack) ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: agri-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - agri-network

  loki:
    image: grafana/loki:2.8.2
    container_name: agri-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - agri-network

  tempo:
    image: grafana/tempo:2.1.1
    container_name: agri-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./monitoring/tempo/tempo.yml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    networks:
      - agri-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  grafana:
    image: grafana/grafana:9.5.2
    container_name: agri-grafana
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin_change_in_prod}
    networks:
      - agri-network
