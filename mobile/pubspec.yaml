name: agridecision_mobile
description: "AgriDecision AI - Production Flutter Mobile Application for Farmers and Agronomists"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management & DI
  provider: ^6.1.2
  
  # Database & Offline Mode
  sqflite: ^2.3.0
  path: ^1.8.3
  shared_preferences: ^2.2.2
  
  # Network & Sync
  dio: ^5.4.0
  connectivity_plus: ^5.0.2
  
  # Device Capabilities
  camera: ^0.10.5+5
  geolocator: ^10.1.0
  flutter_local_notifications: ^16.1.0
  
  # Voice Assistant
  speech_to_text: ^6.3.0
  flutter_tts: ^3.8.3
  
  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  
  # UI & Charts
  fl_chart: ^0.66.0
  intl: ^0.19.0
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
