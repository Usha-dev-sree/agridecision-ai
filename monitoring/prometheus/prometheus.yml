global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'user-service'
    static_configs:
      - targets: ['user-service:8000']
    metrics_path: '/metrics'

  - job_name: 'farm-service'
    static_configs:
      - targets: ['farm-service:8001']
    metrics_path: '/metrics'

  - job_name: 'advisory-service'
    static_configs:
      - targets: ['advisory-service:8002']
    metrics_path: '/metrics'

  - job_name: 'ai-service'
    static_configs:
      - targets: ['ai-service:8080']
    metrics_path: '/metrics'
