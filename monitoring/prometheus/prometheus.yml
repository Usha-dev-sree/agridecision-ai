global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'agridecision-local'
    environment: 'development'

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'user-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['user-service:8000']
        labels:
          service: 'user-service'

  - job_name: 'farm-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['farm-service:8001']
        labels:
          service: 'farm-service'

  - job_name: 'advisory-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['advisory-service:8002']
        labels:
          service: 'advisory-service'

  - job_name: 'weather-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['weather-service:8003']
        labels:
          service: 'weather-service'

  - job_name: 'market-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['market-service:8004']
        labels:
          service: 'market-service'

  - job_name: 'analytics-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['analytics-service:8005']
        labels:
          service: 'analytics-service'

  - job_name: 'financial-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['financial-service:8006']
        labels:
          service: 'financial-service'

  - job_name: 'notification-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification-service:8007']
        labels:
          service: 'notification-service'

  - job_name: 'enterprise-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['enterprise-service:8008']
        labels:
          service: 'enterprise-service'

  - job_name: 'iot-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['iot-service:8009']
        labels:
          service: 'iot-service'

  - job_name: 'kong-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['kong:8001']
        labels:
          service: 'kong-gateway'
