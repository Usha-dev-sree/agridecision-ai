# AgriDecision AI — Alembic Configuration
# ============================================================
# Do NOT commit real database URLs here.
# Set DATABASE_URL environment variable to override at runtime.
# ============================================================

[alembic]
# Database URL — overridden by DATABASE_URL env var in env.py
sqlalchemy.url = postgresql+asyncpg://agridecision:changeme@localhost:5432/agridecision_dev

# Migration scripts location (relative to this alembic.ini)
script_location = database/postgresql/migrations

# Migration file naming: 0001_create_extensions_and_schemas.py
file_template = %%(rev)s_%%(slug)s

# Timezone for migration timestamps
timezone = UTC

# Truncate revision to 4 chars (we use 4-digit revisions like 0001)
truncate_slug_length = 60

# Use UTC for all timestamps
output_encoding = utf-8

# ── PostgreSQL-specific options ───────────────────────────────────────────────
[post_write_hooks]
# Optional: Run black formatter on generated migration scripts
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 100 REVISION_SCRIPT_FILENAME

# ── Logging configuration ─────────────────────────────────────────────────────
[loggers]
keys = root, sqlalchemy, alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
